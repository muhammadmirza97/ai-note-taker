name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile config.py security.py db.py main.py migrate_legacy.py
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Run tests
        run: python -m unittest discover
      - name: Build container
        run: docker build .

  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Run launcher tests
        run: python -m unittest tests.test_launcher_config tests.test_launcher_readiness tests.test_launcher_process tests.test_launcher_imports
      - name: Build and verify launcher exe
        run: .\build.bat
